<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Rohan Sharma — AI/ML Engineer">
  <defs>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sf" x1="0" x2="1">
      <stop offset="0" stop-color="#ff6a00"/><stop offset=".5" stop-color="#ffb066"/><stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff8a1f" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .name{font-weight:900;font-size:76px;letter-spacing:-2px;fill:#f2efe9}
      .mono{font-family:'Cascadia Code','SFMono-Regular',Consolas,monospace}
      .eb{font-size:15px;letter-spacing:4px;fill:#ff8a1f}
      .sub{font-size:24px;fill:#b9b5c0}
      .p{font-size:20px;fill:#f2efe9;opacity:0}
      .p1{animation:cyc 12s infinite}.p2{animation:cyc 12s 4s infinite}.p3{animation:cyc 12s 8s infinite}
      @keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:none}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
      .scan{animation:scan 4s ease-in-out infinite alternate}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(250px)}}
      .dot{animation:pulse 1.6s infinite}
      @keyframes pulse{50%{opacity:.25}}
      .prop{transform-box:fill-box;transform-origin:center;animation:spin .18s linear infinite alternate}
      @keyframes spin{to{transform:scaleX(.35)}}
      .drone{animation:hover 3s ease-in-out infinite alternate}
      @keyframes hover{to{transform:translateY(10px)}}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="360" fill="#07070a"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <!-- left copy -->
    <line x1="60" y1="82" x2="96" y2="82" stroke="#ff8a1f" stroke-width="2"/>
    <text x="108" y="88" class="t mono eb">AI / ML ENGINEER — INDIA</text>
    <text x="56" y="168" class="t name">ROHAN SHARMA</text>
    <text x="60" y="212" class="t sub">LLM systems for how India types · Drone computer vision</text>
    <circle cx="68" cy="268" r="6" fill="#4ade80" class="dot"/>
    <g class="t mono">
      <text x="86" y="275" class="p p1">building <tspan fill="#ff8a1f">Bharat-Router</tspan> — a cost-aware LLM router for Hinglish</text>
      <text x="86" y="275" class="p p2">ex-intern <tspan fill="#ff8a1f">@ Teific</tspan> — YOLO on ~10,000 drone images, ~92%</text>
      <text x="86" y="275" class="p p3"><tspan fill="#ff8a1f">AWS Certified ×2</tspan> · B.Tech CSE (AI &amp; ML) · CGPA 8.4</text>
    </g>
    <!-- right: drone scanning a road -->
    <g transform="translate(870 0)">
      <path d="M60 360 L150 120 L230 120 L320 360 Z" fill="#141418"/>
      <path d="M190 130 V360" stroke="#b07a2a" stroke-width="4" stroke-dasharray="22 18"/>
      <ellipse cx="160" cy="300" rx="20" ry="9" fill="#030303" stroke="#ff8a1f" stroke-width="2"/>
      <rect x="128" y="278" width="64" height="44" fill="none" stroke="#ff8a1f" stroke-width="1.5" stroke-dasharray="10 34" class="dot"/>
      <rect x="112" y="252" width="86" height="20" rx="4" fill="#07070a" stroke="#ff8a1f"/>
      <text x="155" y="266" text-anchor="middle" class="t mono" font-size="11" fill="#ff8a1f">POTHOLE 0.92</text>
      <g class="scan"><rect x="70" y="105" width="240" height="2" fill="#ff8a1f" opacity=".7"/></g>
      <g class="drone">
        <path d="M160 92 L80 300 L300 300 Z" fill="#ff8a1f" opacity=".06"/>
        <line x1="110" y1="70" x2="210" y2="70" stroke="#2a2a30" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="160" cy="76" rx="38" ry="15" fill="#ff6a1a"/>
        <ellipse cx="160" cy="71" rx="22" ry="6" fill="#ffb066" opacity=".55"/>
        <circle cx="160" cy="92" r="7" fill="#0a0a0e" stroke="#2a2a30"/>
        <ellipse cx="108" cy="62" rx="26" ry="4" fill="#9aa0b4" opacity=".35" class="prop"/>
        <ellipse cx="212" cy="62" rx="26" ry="4" fill="#9aa0b4" opacity=".35" class="prop"/>
        <circle cx="108" cy="66" r="4" fill="#ff3b3b"/><circle cx="212" cy="66" r="4" fill="#3bff8a"/>
      </g>
    </g>
    <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#24232b" stroke-width="2"/>
  </g>
</svg>
