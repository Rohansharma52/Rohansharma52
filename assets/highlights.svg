<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Highlights: ~92% YOLO detection on ~10,000 drone images; found RouteLLM AUC drops 0.55 to 0.33 on Hinglish; AWS Certified x2; CGPA 8.4">
  <defs>
    <linearGradient id="sf" x1="0" x2="1"><stop offset="0" stop-color="#ff6a00"/><stop offset=".5" stop-color="#ffc58a"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/><stop offset=".5" stop-color="#ff8a1f" stop-opacity=".9"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></linearGradient>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'Cascadia Code','SFMono-Regular',Consolas,monospace}
      .big{font-weight:900;font-size:44px;letter-spacing:-1px}
      .lbl{font-size:15px;fill:#c9c5cf}
      .tag{font-size:11px;letter-spacing:2.5px;fill:#ff8a1f}
      .c{opacity:0;animation:in .7s ease forwards}
      .c2{animation-delay:.15s}.c3{animation-delay:.3s}.c4{animation-delay:.45s}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .sw{animation:sw 3.2s linear infinite}
      @keyframes sw{from{transform:translateX(-120px)}to{transform:translateX(300px)}}
    </style>
    <clipPath id="k1"><rect x="0" y="0" width="285" height="160" rx="18"/></clipPath>
  </defs>
  <g transform="translate(0 5)"><g class="c c1">
    <rect width="285" height="160" rx="18" fill="#0b0b10" stroke="#3a2a1c"/>
    <g clip-path="url(#k1)"><rect class="sw" x="0" y="0" width="120" height="2" fill="url(#sweep)"/></g>
    <text x="24" y="38" class="t m tag">INDUSTRY · DRONES</text>
    <text x="24" y="92" class="t big" fill="url(#sf)">~92%</text>
    <text x="24" y="122" class="t lbl">YOLO road-hazard detection</text>
    <text x="24" y="144" class="t lbl">on ~10,000 aerial images</text>
  </g></g>
  <g transform="translate(305 5)"><g class="c c2">
    <rect width="285" height="160" rx="18" fill="#0b0b10" stroke="#24232b"/>
    <text x="24" y="38" class="t m tag">RESEARCH · LLMs</text>
    <text x="24" y="92" class="t big" fill="#f2efe9">0.55<tspan fill="#8d8a94" font-size="28"> → </tspan><tspan fill="url(#sf)">0.33</tspan></text>
    <text x="24" y="122" class="t lbl">RouteLLM AUC, English → Hinglish</text>
    <text x="24" y="144" class="t lbl">found in my Bharat-Router study</text>
  </g></g>
  <g transform="translate(610 5)"><g class="c c3">
    <rect width="285" height="160" rx="18" fill="#0b0b10" stroke="#24232b"/>
    <text x="24" y="38" class="t m tag">CLOUD</text>
    <text x="24" y="92" class="t big" fill="#f2efe9">AWS <tspan fill="url(#sf)">×2</tspan></text>
    <text x="24" y="122" class="t lbl">Solutions Architect +</text>
    <text x="24" y="144" class="t lbl">Cloud Practitioner certified</text>
  </g></g>
  <g transform="translate(915 5)"><g class="c c4">
    <rect width="285" height="160" rx="18" fill="#0b0b10" stroke="#24232b"/>
    <text x="24" y="38" class="t m tag">ACADEMICS</text>
    <text x="24" y="92" class="t big" fill="#f2efe9">8.4<tspan fill="#8d8a94" font-size="26"> / 10</tspan></text>
    <text x="24" y="122" class="t lbl">CGPA · B.Tech CSE (AI &amp; ML)</text>
    <text x="24" y="144" class="t lbl">KIET, batch of 2028</text>
  </g></g>
</svg>
